<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dokkan Gallery</title>
  <link rel="stylesheet" href="gallery.css" />
</head>
<body>
  <header class="topbar">
    <h1>Card Gallery</h1>
    <a class="btn" href="index.html">Back to Editor</a>
  </header>

  <main>
    <section class="filters">
      <div class="filter-row">
        <label>
          Type:
          <select id="filterType">
            <option value="ALL">All</option>
            <option value="AGL">AGL</option>
            <option value="TEQ">TEQ</option>
            <option value="INT">INT</option>
            <option value="STR">STR</option>
            <option value="PHY">PHY</option>
          </select>
        </label>

        <label>
          Class:
          <select id="filterAlign">
            <option value="ALL">All</option>
            <option value="SUPER">Super</option>
            <option value="EXTREME">Extreme</option>
          </select>
        </label>

        <label>
          Rarity:
          <select id="filterRarity">
            <option value="ALL">All</option>
            <option value="LR">LR</option>
            <option value="UR">UR</option>
          </select>
        </label>
        <button class="btn small" id="clearFiltersBtn" type="button">Clear</button>
      </div>

      <details class="category-panel" open>
        <summary>Categories</summary>

        <input
          id="categorySearch"
          class="category-search"
          type="text"
          placeholder="Search category…"
          autocomplete="off"
        />

        <div id="categoryList" class="category-list"></div>
      </details>
    </section>

    <div id="galleryGrid" class="grid"></div>
  </main>

  <script src="gallery.js"></script>
</body>
</html>
